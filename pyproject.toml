[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "fea-structural-automation"
version = "0.2.0"
description = "Sanitized engineering quick-screen tools for structural and sealing studies."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Erick Enriquez"}]
keywords = ["fea", "engineering", "oring", "automation", "python"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.10",
]

[project.scripts]
fea-oring-screen = "fea_structural_automation.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fea_structural_automation"]

[tool.pytest.ini_options]
addopts = "-q --cov=fea_structural_automation --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["fea_structural_automation"]

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*", "matplotlib", "matplotlib.*"]
follow_imports = "skip"
ignore_missing_imports = true

name: quality

on:
  push:
    branches: [main, portfolio-v1]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install --upgrade pip && pip install -e .[dev]
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src
      - name: Test
        run: pytest
      - name: Generate advanced case-study figures
        if: matrix.python-version == '3.12'
        env:
          MPLBACKEND: Agg
        run: python examples/advanced_case_study.py
      - name: Upload advanced case-study figures
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: advanced-case-study-figures
          path: results/advanced_case_study/*.png
          if-no-files-found: error
